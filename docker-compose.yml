version: '3.8'
services:
  alist:
    image: xhofe/alist:latest
    container_name: alist
    restart: unless-stopped
    ports:
      - "5244:5244"
    volumes:
      - /srv/alist/data:/opt/alist/data
      - /srv/alist/uploads:/srv/alist/uploads
    environment:
      - ALIST_ADMIN_PASSWORD=Alist@2024!
